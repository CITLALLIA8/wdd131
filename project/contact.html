<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Contact Malva Boutique: send your questions about sizes, orders or products using the contact form.">
<meta name="author" content="Citlalli Ahumada">
<title>Malva Boutique | Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
<header>
<a class="brand" href="index.html"><img src="images/logo.svg" alt="" width="44" height="44">Malva Boutique</a>
<button id="menu-btn" type="button" aria-expanded="false" aria-controls="main-nav">Menu</button>
<nav aria-label="Main">
<ul id="main-nav">
<li><a href="index.html">Home</a></li>
<li><a href="catalog.html">Catalog</a></li>
<li><a href="contact.html" class="active" aria-current="page">Contact</a></li>
</ul>
</nav>
</header>
<main>
<h1>Contact us</h1>
<p>Do you have a question about a size, an order or a product? Send us a message.</p>
<form id="contact-form" novalidate>
<div>
<label for="name">Full name</label>
<input type="text" id="name" name="name" autocomplete="name" required>
<p class="error" id="name-error"></p>
</div>
<div>
<label for="email">Email</label>
<input type="email" id="email" name="email" autocomplete="email" required>
<p class="error" id="email-error"></p>
</div>
<div>
<label for="topic">Topic</label>
<select id="topic" name="topic" required>
<option value="">Select a topic</option>
<option>Sizes</option>
<option>Order status</option>
<option>Products</option>
<option>Other</option>
</select>
<p class="error" id="topic-error"></p>
</div>
<div>
<label for="message">Message</label>
<textarea id="message" name="message" rows="5" required></textarea>
<p class="error" id="message-error"></p>
</div>
<button class="btn" type="submit">Send message</button>
<p id="form-status" role="status"></p>
</form>
</main>
<footer>
<p>&copy; <span id="year">2026</span> Malva Boutique | Citlalli Ahumada | Fictional site for WDD 131</p>
<p>Last modified: <span id="modified"></span></p>
</footer>
<script src="scripts/script.js"></script>
</body>
</html>
