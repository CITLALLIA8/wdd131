<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album</title>
    <meta name="description" content="Temple Album: a responsive photo gallery of temples from around the world, with a mobile menu and a large-screen layout.">
    <meta name="author" content="Citlalli Ahumada">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css" media="(min-width: 700px)">
    <script src="scripts/temples.js" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles/temples.css">
<link rel="stylesheet" href="styles/temples-large.css">
</head>
<body>
    <header>
        <h2>Temple Album</h2>
        <button id="menu" aria-label="Toggle menu">☰</button>
        <nav>
            <a href="#">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
    </header>

    <main>
        <h1>Temple Album</h1>
        <div class="gallery">
            <figure>
                <img src="week02/images/templedallas.webp" alt="Dallas temple" loading="lazy" width="400" height="250">
                <figcaption>Dallas temple</figcaption>
            </figure>
            <figure>
                <img src="week02/images/templephilippines.webp" alt="philippines temple" loading="lazy" width="400" height="250">
                <figcaption>philippines temple</figcaption>
            </figure>
            <figure>
                <img src="week02/images/fresnotemple.webp" alt="Fresno California" loading="lazy" width="400" height="250">
                <figcaption>Fresno Temple</figcaption>
            </figure>
            <figure>
                <img src="week02/images/fukuokatemple.webp" alt="Fukuoka Temple" loading="lazy" width="400" height="250">
                <figcaption>Fukuoka Temple</figcaption>
            </figure>
            <figure>
                <img src="week02/images/gilberttemple.webp" alt="Gilbert Temple" loading="lazy" width="400" height="250">
                <figcaption>Gilbert Temple</figcaption>
            </figure>
            <figure>
                <img src="week02/images/guadalajaratemple.webp" alt="Guadalajara Temple" loading="lazy" width="400" height="250">
                <figcaption>Guadalajara Temple</figcaption>
            </figure>
            <figure>
                <img src="week02/images/guatemalatemple.webp" alt="Guatemala Temple" loading="lazy" width="400" height="250">
                <figcaption>Guatemala Temple</figcaption>
            </figure>
            <figure>
                <img src="week02/images/hermosillotemple.webp" alt="Hermosillo Temple" loading="lazy" width="400" height="250">
                <figcaption>Hermosillo Temple</figcaption>
            </figure>
            <figure>
                <img src="week02/images/houstontemple.webp" alt="Houston Temple" loading="lazy" width="400" height="250">
                <figcaption>Houston Temple</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Citlalli Ahumada | Mexico</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
