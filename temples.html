<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album</title>
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css" media="(min-width: 700px)">
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <h2>Temple Album</h2>
        <button id="menu" aria-label="Toggle menu">☰</button>
        <nav>
            <a href="#">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
    </header>

    <main>
        <h1>Temple Album</h1>
        <div class="gallery">
            <figure>
                <img src="images/templedallas.webp" alt="Dallas temple" loading="lazy" width="400" height="250">
                <figcaption>Dallas temple</figcaption>
            </figure>
            <figure>
                <img src="images/templephilippines.webp" alt="philippines temple" loading="lazy" width="400" height="250">
                <figcaption>philippines temple</figcaption>
            </figure>
            <figure>
                <img src="images/fresnotemple.webp" alt="Fresno California" loading="lazy" width="400" height="250">
                <figcaption>Fresno Temple</figcaption>
            </figure>
            <figure>
                <img src="images/fukuokatemple.webp" alt="Fukuoka Temple" loading="lazy" width="400" height="250">
                <figcaption>Fukuoka Temple</figcaption>
            </figure>
            <figure>
                <img src="images/gilberttemple.webp" alt="Gilbert Temple" loading="lazy" width="400" height="250">
                <figcaption>Gilbert Temple</figcaption>
            </figure>
            <figure>
                <img src="images/guadalajaratemple.webp" alt="Guadalajara Temple" loading="lazy" width="400" height="250">
                <figcaption>Guadalajara Temple</figcaption>
            </figure>
            <figure>
                <img src="images/guatemalatemple.webp" alt="Guatemala Temple" loading="lazy" width="400" height="250">
                <figcaption>Guatemala Temple</figcaption>
            </figure>
            <figure>
                <img src="images/hermosillotemple.webp" alt="Hermosillo Temple" loading="lazy" width="400" height="250">
                <figcaption>Hermosillo Temple</figcaption>
            </figure>
            <figure>
                <img src="images/houstontemple.webp" alt="Houston Temple" loading="lazy" width="400" height="250">
                <figcaption>Houston Temple</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Citlalli Ahumada | Mexico</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
