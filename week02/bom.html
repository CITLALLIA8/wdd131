<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Enter and keep a list of your favorite Book of Mormon chapters.">
    <title>BOM Top 10 | Favorite Chapters</title>
    <link rel="stylesheet" href="styles/bom.css">

        </div>

        <ul id="list"></ul>
    </main>
